name: fly-deploy

# Auto-deploys to Fly.io on every push to main AFTER backend-ci goes green.
# Requires a repository secret `FLY_API_TOKEN` (create one locally with
# `flyctl tokens create deploy -a ipca-nowcast-api` and paste into
# Settings → Secrets and variables → Actions).

on:
  workflow_run:
    workflows: ["backend-ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
