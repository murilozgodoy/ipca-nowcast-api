[project]
name = "ipca-nowcast-api"
version = "0.1.0"
description = "Open-data IPCA nowcasting API and backtesting toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Murilo Zampar Godoy" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pandera>=0.21",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "typer>=0.13",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
macro = "ipca_nowcast.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipca_nowcast"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "PT", "RET", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]
# typer requires `typer.Option(...)` in function defaults
"src/ipca_nowcast/cli/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ipca_nowcast.db.*"]
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live database",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/ipca_nowcast"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
